<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Results</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <div class="container">
    <h1>✅ Results</h1>

    <p class="score-text">
      You answered <strong>{{ score }}</strong> out of
      <strong>{{ total }}</strong> correctly.
    </p>

    <div class="button-group">
      <a href="{{ url_for('questions') }}" class="btn btn-primary">
        🔄 Try Again
      </a>

      <a href="{{ url_for('upload') }}" class="btn btn-secondary">
        📄 Try New Data
      </a>
    </div>
  </div>

</body>
</html>
